<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Repuestos críticos · SIGMA</title>
<link rel="stylesheet" href="sigma-styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="sigma-utils.js"></script>
<style>
.rp .tabs{display:flex;gap:.4rem;margin-bottom:1.3rem;border-bottom:1px solid var(--line)}
.rp .tabs button{background:none;border:none;padding:.65rem 1.1rem;font-size:.85rem;font-weight:600;color:var(--steel-400);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.rp .tabs button.on{color:var(--amber-500);border-bottom-color:var(--amber-500)}
.rp .bar{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;margin-bottom:1rem}
.rp .bar label{display:flex;align-items:center;gap:.4rem;font-size:.82rem;color:var(--steel-200);text-transform:none;font-weight:500}
.rp .bar input[type=checkbox],.rp .bar input[type=radio]{width:auto;margin:0}
.rp button.b{background:var(--steel-900);color:var(--steel-200);border:1px solid var(--line)}
.rp .sc{overflow-x:auto}.rp td input{min-width:80px}
.rp .kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.3rem}
.rp .kp div{background:var(--steel-900);border:1px solid var(--line);border-radius:var(--radius-sm);padding:.8rem 1rem;font-size:.8rem;color:var(--steel-400)}
.rp .kp b{display:block;font-size:1.5rem;color:var(--steel-200)}
.rp .warn{color:var(--amber-500)}.rp .num{text-align:right}
.rp .bar input:not([type]),.rp .bar input[type=search],.rp .bar>select{flex:1 1 220px;width:auto;min-width:0}
.rp .hint{color:var(--steel-400);font-size:.85rem;margin:-.4rem 0 1rem}
.rp details{margin:.7rem 0}.rp summary{cursor:pointer;color:var(--steel-400);font-size:.82rem;font-weight:600;padding:.2rem 0}
.rp details[open]>summary{margin-bottom:.5rem}
.rp td small{color:var(--steel-400)}
</style></head>
<body>
<div id="nav-slot"></div>
<div class="container rp">
  <div class="panel-head"><h1>Repuestos críticos</h1></div>
  <p class="hint">Cargá los repuestos de cada equipo, completá sus costos y obtené el presupuesto del año.</p>
  <div class="tabs" id="tabs"></div>
  <div class="plate panel"><div id="view">Cargando…</div></div>
</div>
<script>
document.getElementById('nav-slot').innerHTML=sigmaRenderNav('repuestos');
const S={ajuste:0,sap:{cat:[],des:[],cargado:false,imp:null,q:'',est:'',libres:false,sel:new Set(),res:null},eq:[],rep:[],pre:{},tab:'eq',q:'',sf:'',crit:new Set(['A','B']),shared:false,sel:'',onlyNo:false,lines:[],list:[],manual:[],stock:[],ped:{soloPedir:true,cat:'',form:false,items:[]}};
const $=id=>document.getElementById(id);
new MutationObserver(()=>document.querySelectorAll('#view table:not(.sigma-table)').forEach(t=>t.classList.add('sigma-table'))).observe($('view'),{childList:true,subtree:true});
const norm=s=>String(s||'').trim().toUpperCase().replace(/\s+/g,' ');
const num=v=>parseFloat(String(v||'').replace(',','.'))||0;
const fmt=n=>Math.round(n).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const clave=r=>{const c=norm(r.Codigo_Repuesto),ok=c&&c!=='S/C';return (ok?c:'S/C')+'|'+norm(r.Designacion)+(ok?'':'|'+norm(r.Nombre));};
const CR=['A','B','C','X'];
const LBL={A:'A · crítico',B:'B · importante',C:'C · bajo demanda',X:'Fuera (stock general)'};

function sugerir(e){
  const c=e.Codigo_SIGMA||'',m=((e.Maquina||'')+' '+(e.Ubicacion||'')).toLowerCase();
  if(/^BV-(GE|TL)-|-(AC001|AD001|EC001|GB001)$/.test(c))return 'X';
  if(/tamiz/.test(m))return 'B';
  if(/turbina|turbogenerador|turbo |reductor|rotor|catalina|alimentaci[oó]n|mesa de ca[nñ]a|conductora/.test(m)&&!/desagote/.test(m))return 'A';
  if(/floculante|soda|lechada|ceniza|barro|agua caliente|desagote|reserva|lavado de|agitador|elevador|paletiz|cargadora|semillero/.test(m))return 'C';
  if(/centr[ií]fuga|jugo|vac[ií]o|barom|nemo|masa cocida|miel|compresor|filtro|regulador|rastra|esparcidor|vti|vtf|melado|jarabe|magma|cocimiento|secador/.test(m))return 'B';
  return 'C';
}

async function load(){
  try{
    const [eq,rep,pre,man,stk]=await Promise.all([sigmaFetchTab('Equipos'),sigmaFetchTab('Repuestos'),sigmaFetchTab('Precios').catch(()=>[]),sigmaFetchTab('Pedido_Manual').catch(()=>[]),sigmaFetchTab('Stock_SAP').catch(()=>[])]);
    S.eq=eq;S.rep=rep;S.manual=man;S.stock=stk;pre.forEach(p=>S.pre[p.Clave_Repuesto]=p);
    render();
  }catch(e){$('view').innerHTML='<p class="warn">No se pudieron leer los datos: '+esc(e.message)+'</p>';}
}
function render(){
  const T=[['eq','Equipos y repuestos'],['pre','Presupuesto'],['ped','Solicitud de pedido'],['sap','Datos de SAP']].filter(([t])=>t==='sap'?sigmaPuede('importar_catalogo_sap'):((t!=='pre'&&t!=='ped')||sigmaPuedeLeer('Precios')));
  $('tabs').innerHTML=T.map(([t,l])=>`<button class="${S.tab===t?'on':''}" onclick="irTab('${t}')">${l}</button>`).join('');
  if(S.tab==='eq')(S.sel?viewRep:viewEq)();else({pre:viewPre,ped:viewPed,sap:viewSap})[S.tab]();
}
function irTab(t){S.tab=t;if(t==='eq')S.sel='';render();}

/* ---------- EQUIPOS ---------- */
function viewEq(){
  const sec=[...new Set(S.eq.map(e=>e.Sector).filter(Boolean))].sort();
  const sin=S.eq.filter(e=>!e.Criticidad).length;
  const ph={Codigo_SIGMA:'Código del equipo',Maquina:'Nombre del equipo',Sector:'Sector',Ubicacion:'Ubicación',Modelo:'Modelo',Fabricante:'Fabricante','Año':'Año'};
  $('view').innerHTML=`<div class="bar">
    <input id="q" placeholder="Buscar equipo o código" value="${esc(S.q)}" oninput="S.q=this.value;drawEq()">
    <select onchange="S.sf=this.value;drawEq()"><option value="">Todos los sectores</option>${sec.map(s=>`<option ${S.sf===s?'selected':''}>${s}</option>`).join('')}</select>
    <button class="b" data-requiere="crear_equipo" onclick="$('nuevo').hidden=!$('nuevo').hidden">+ Agregar equipo</button></div>
    ${sin?`<p class="hint" data-requiere="actualizar_criticidad"><span class="warn">${sin} equipos sin criticidad.</span> <button class="b" onclick="sugerirTodos()">Sugerir criticidad automáticamente</button></p>`:''}
    <div id="nuevo" class="plate" style="padding:1rem;margin-bottom:1rem" data-requiere="crear_equipo" hidden>
      <div class="bar">${['Codigo_SIGMA','Maquina','Sector'].map(k=>`<input id="n_${k}" placeholder="${ph[k]}">`).join('')}
      <select id="n_Criticidad">${CR.map(c=>`<option>${c}</option>`).join('')}</select></div>
      <details><summary>Más datos (opcional)</summary><div class="bar">${['Ubicacion','Modelo','Fabricante','Año'].map(k=>`<input id="n_${k}" placeholder="${ph[k]}">`).join('')}</div></details>
      <button onclick="addEq()">Guardar equipo</button></div>
    <div class="sc" id="tbl"></div>`;
  drawEq();
}
function drawEq(){
  const q=S.q.toLowerCase(),cnt={};S.rep.forEach(r=>cnt[r.Codigo_Equipo]=(cnt[r.Codigo_Equipo]||0)+1);
  const rows=S.eq.filter(e=>(!S.sf||e.Sector===S.sf)&&(e.Codigo_SIGMA+' '+e.Maquina+' '+e.Ubicacion).toLowerCase().includes(q));
  if(!rows.length){$('tbl').innerHTML='<p>No hay equipos que coincidan con la búsqueda.</p>';return;}
  $('tbl').innerHTML=`<table><tr><th>Equipo</th><th>Criticidad</th><th>Repuestos</th></tr>`+
   rows.map(e=>`<tr><td><b>${esc(e.Maquina)}</b><br><small>${esc(e.Codigo_SIGMA)} · ${esc(e.Sector)}${e.Ubicacion?' · '+esc(e.Ubicacion):''}</small></td>
   <td><select data-requiere-bloquear="actualizar_criticidad" onchange="setCrit('${e.Codigo_SIGMA}',this.value)"><option value="">Sin clasificar</option>${CR.map(c=>`<option value="${c}" ${e.Criticidad===c?'selected':''}>${LBL[c]}</option>`).join('')}</select></td>
   <td><button class="b" onclick="abrirRep('${e.Codigo_SIGMA}')">${cnt[e.Codigo_SIGMA]?cnt[e.Codigo_SIGMA]+' · Ver':'Cargar'}</button></td></tr>`).join('')+'</table>';
}
async function setCrit(cod,v){
  S.eq.find(e=>e.Codigo_SIGMA===cod).Criticidad=v;
  await sigmaPost('actualizar_criticidad',{items:[{Codigo_SIGMA:cod,Criticidad:v}]});sigmaToast('Criticidad guardada');
}
async function sugerirTodos(){
  const items=S.eq.filter(e=>!e.Criticidad).map(e=>({Codigo_SIGMA:e.Codigo_SIGMA,Criticidad:sugerir(e)}));
  if(!items.length||!confirm('Se asignará una criticidad sugerida a '+items.length+' equipos. Podés cambiarla después. ¿Continuar?'))return;
  items.forEach(i=>S.eq.find(e=>e.Codigo_SIGMA===i.Codigo_SIGMA).Criticidad=i.Criticidad);
  await sigmaPost('actualizar_criticidad',{items});sigmaToast('Sugerencia aplicada');viewEq();
}
async function addEq(){
  const o={};['Codigo_SIGMA','Sector','Ubicacion','Maquina','Modelo','Fabricante','Año','Criticidad'].forEach(k=>o[k]=$('n_'+k).value.trim());
  if(!o.Codigo_SIGMA||!o.Maquina)return sigmaToast('Faltan código y nombre del equipo');
  if(S.eq.some(e=>e.Codigo_SIGMA===o.Codigo_SIGMA))return sigmaToast('Ese código ya existe');
  await sigmaPost('crear_equipo',o);S.eq.push(o);sigmaToast('Equipo agregado');viewEq();
}

/* ---------- REPUESTOS DE UN EQUIPO ---------- */
function abrirRep(c){S.sel=c;render();}
function viewRep(){
  const eq=S.eq.find(e=>e.Codigo_SIGMA===S.sel);
  if(!eq){S.sel='';return viewEq();}
  $('view').innerHTML=`<div class="bar"><button class="b" onclick="S.sel='';render()">← Volver a equipos</button>
   <button data-requiere="guardar_repuesto" onclick="addRep()">+ Agregar repuesto</button></div>
   <p><b>${esc(eq.Maquina)}</b><br><small>${esc(eq.Codigo_SIGMA)} · ${esc(eq.Sector)}${eq.Ubicacion?' · '+esc(eq.Ubicacion):''}</small></p><div class="sc" id="tbl"></div>`;
  drawRep();
}
function drawRep(){
  const F=['Nombre','Marca','Designacion','Codigo_Repuesto','Cant.'],H={Nombre:'Repuesto',Marca:'Marca',Designacion:'Designación',Codigo_Repuesto:'Código SAP','Cant.':'Cantidad'};
  if(!S.rep.some(r=>r.Codigo_Equipo===S.sel)){$('tbl').innerHTML='<p>Este equipo todavía no tiene repuestos. Usá «+ Agregar repuesto».</p>';return;}
  $('tbl').innerHTML=`<table><tr>${F.map(f=>`<th>${H[f]}</th>`).join('')}<th></th></tr>`+
   S.rep.map((r,i)=>r.Codigo_Equipo!==S.sel?'':`<tr>${F.map((f,j)=>`<td><input data-requiere-bloquear="guardar_repuesto" id="r${i}_${j}" value="${esc(r[f])}"></td>`).join('')}
   <td><button class="b" data-requiere="guardar_repuesto" onclick="saveRep(${i})">Guardar</button> <button class="b" data-requiere="eliminar_repuesto" onclick="delRep(${i})">Quitar</button></td></tr>`).join('')+'</table>';
}
function addRep(){if(!S.sel)return sigmaToast('Elegí un equipo primero');S.rep.push({Codigo_Equipo:S.sel,Nombre:'',Marca:'',Designacion:'',Codigo_Repuesto:'','Cant.':'',_nuevo:true});drawRep();}
async function saveRep(i){
  const r=S.rep[i],F=['Nombre','Marca','Designacion','Codigo_Repuesto','Cant.'],o={Codigo_Equipo:r.Codigo_Equipo};
  F.forEach((f,j)=>o[f]=$(`r${i}_${j}`).value.trim());
  if(!o.Nombre)return sigmaToast('El repuesto necesita un nombre');
  await sigmaPost('guardar_repuesto',{...o,Orig_Nombre:r.Nombre,Orig_Designacion:r.Designacion,nuevo:!!r._nuevo});
  Object.assign(r,o);delete r._nuevo;sigmaToast('Repuesto guardado');
}
async function delRep(i){
  const r=S.rep[i];if(!confirm('¿Quitar este repuesto del equipo?'))return;
  if(!r._nuevo)await sigmaPost('eliminar_repuesto',{Codigo_Equipo:r.Codigo_Equipo,Nombre:r.Nombre,Designacion:r.Designacion});
  S.rep.splice(i,1);drawRep();sigmaToast('Repuesto quitado');
}

/* ---------- COSTOS Y PRESUPUESTO ---------- */
function calc(){
  const cr={},sc={};S.eq.forEach(e=>{cr[e.Codigo_SIGMA]=e.Criticidad||'?';sc[e.Codigo_SIGMA]=e.Sector||'?';});
  const L={};
  S.rep.forEach(r=>{
    const c=cr[r.Codigo_Equipo]||'?';if(!S.crit.has(c))return;
    const k=clave(r),s=sc[r.Codigo_Equipo]||'?',key=S.shared?k:k+'|'+s+'|'+c,q=num(r['Cant.']);
    const it=L[key]||(L[key]={k,r,s,c,q:0});
    it.q=S.shared?Math.max(it.q,q):it.q+q;
  });
  S.lines=Object.values(L);
  const U={};S.lines.forEach(l=>{const u=U[l.k]||(U[l.k]={k:l.k,r:l.r,q:0});u.q+=l.q;});
  S.list=Object.values(U).sort((a,b)=>(!!S.pre[a.k]-!!S.pre[b.k])||norm(a.r.Nombre).localeCompare(norm(b.r.Nombre)));
}
const precioBase=k=>num(S.pre[k]&&S.pre[k].Costo_Unitario);
const precio=k=>precioBase(k)*(1+(S.ajuste||0)/100);
function viewPre(){
  const sin=S.eq.filter(e=>!e.Criticidad).length;
  $('view').innerHTML=`<div id="sum"></div>
   <div class="bar"><label><input type="checkbox" ${S.onlyNo?'checked':''} onchange="S.onlyNo=this.checked;drawList()"> Mostrar solo los que no tienen costo</label>
   <button onclick="exportar()">Exportar a Excel</button></div>
   <details ${S.opt?'open':''} ontoggle="S.opt=this.open"><summary>Opciones del presupuesto</summary><div class="bar">Incluir equipos de criticidad:
   ${['A','B','C','?'].map(c=>`<label><input type="checkbox" ${S.crit.has(c)?'checked':''} onchange="this.checked?S.crit.add('${c}'):S.crit.delete('${c}');viewPre()"> ${c==='?'?'Sin clasificar ('+sin+')':c}</label>`).join(' ')}</div>
   <div class="bar"><label><input type="checkbox" ${S.shared?'checked':''} onchange="S.shared=this.checked;viewPre()"> Stock compartido entre equipos (se toma la cantidad máxima, no la suma)</label>
   <label title="Para proyectar el presupuesto del año próximo: sube o baja todos los costos por este porcentaje (no modifica los costos guardados)">Ajuste de costos año próximo (%) <input type="number" step="any" style="width:90px" value="${S.ajuste||''}" placeholder="0" onchange="S.ajuste=Number(this.value)||0;viewPre()"></label></div></details>
   <div class="sc" id="tbl"></div>`;
  calc();drawSum();drawList();
}
function drawSum(){
  const M={},T={};let tot=0,sinP=new Set();
  S.lines.forEach(l=>{const v=l.q*precio(l.k);tot+=v;if(!precioBase(l.k))sinP.add(l.k);
    (M[l.s]=M[l.s]||{})[l.c]=(M[l.s][l.c]||0)+v;T[l.c]=(T[l.c]||0)+v;});
  const cols=['A','B','C','?'].filter(c=>S.crit.has(c));
  $('sum').innerHTML=`<div class="kp"><div><b>${fmt(tot)}</b>Presupuesto total${S.ajuste?` (con ajuste de ${S.ajuste}%)`:''}</div><div><b>${S.list.length}</b>Repuestos distintos</div>
   <div><b class="${sinP.size?'warn':''}">${sinP.size}</b>Sin costo cargado</div></div>
   <p class="hint">Incluye equipos de criticidad ${cols.map(c=>c==='?'?'sin clasificar':c).join(', ')||'(ninguna elegida)'}. ${sinP.size?'Los repuestos sin costo todavía no suman al total.':''}</p>
   <details ${S.sec?'open':''} ontoggle="S.sec=this.open"><summary>Ver el total por sector y criticidad</summary><div class="sc"><table><tr><th>Sector</th>${cols.map(c=>`<th class="num">${c}</th>`).join('')}<th class="num">Total</th></tr>`+
   Object.keys(M).sort().map(s=>`<tr><td>${esc(s)}</td>${cols.map(c=>`<td class="num">${fmt(M[s][c]||0)}</td>`).join('')}<td class="num">${fmt(Object.values(M[s]).reduce((a,b)=>a+b,0))}</td></tr>`).join('')+
   `<tr><th>Total</th>${cols.map(c=>`<th class="num">${fmt(T[c]||0)}</th>`).join('')}<th class="num">${fmt(tot)}</th></tr></table></div></details>`;
}
function drawList(){
  const rows=S.list.map((u,i)=>[u,i]).filter(([u])=>!S.onlyNo||!S.pre[u.k]);
  $('tbl').innerHTML=`<h3>Costo de cada repuesto</h3>`+(rows.length?`<table><tr><th>Repuesto</th><th>Código</th><th class="num">Cantidad</th><th>Costo unitario</th><th>Plazo (días)</th></tr>`+
   rows.map(([u,i])=>{const p=S.pre[u.k]||{};return `<tr><td>${esc(u.r.Nombre)}${u.r.Designacion?`<br><small>${esc(u.r.Designacion)}</small>`:''}</td><td>${esc(u.r.Codigo_Repuesto)}${p.Fuente==='SAP'?' <small title="Precio tomado de SAP el '+esc(p.Fecha_Precio)+'">· SAP</small>':''}</td><td class="num">${u.q}</td>
   <td><input data-requiere-bloquear="guardar_precio" type="number" min="0" step="any" value="${esc(p.Costo_Unitario)}" onchange="setPre(${i},'Costo_Unitario',this.value)"></td>
   <td><input data-requiere-bloquear="guardar_precio" type="number" min="0" value="${esc(p.Plazo_Dias)}" onchange="setPre(${i},'Plazo_Dias',this.value)"></td></tr>`;}).join('')+'</table>':'<p>No hay repuestos para mostrar con estas opciones.</p>');
}
async function setPre(i,f,v){
  const u=S.list[i],p=S.pre[u.k]||(S.pre[u.k]={Clave_Repuesto:u.k,Codigo_Repuesto:u.r.Codigo_Repuesto,Nombre:u.r.Nombre,Designacion:u.r.Designacion});
  p[f]=v===''?'':Number(v);drawSum();
  await sigmaPost('guardar_precio',{...p});sigmaToast('Costo guardado');
}
function exportar(){
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(S.lines.map(l=>({Sector:l.s,Criticidad:l.c,Repuesto:l.r.Nombre,Designacion:l.r.Designacion,Codigo:l.r.Codigo_Repuesto,Cantidad:l.q,Costo_Unitario_Cargado:precioBase(l.k),Ajuste_Pct:S.ajuste||0,Costo_Unitario:precio(l.k),Subtotal:l.q*precio(l.k)}))),'Presupuesto');
  XLSX.writeFile(wb,'presupuesto_repuestos.xlsx');
}
/* ---------- SOLICITUD DE PEDIDO ---------- */
async function viewPed(){
  $('view').innerHTML='Calculando…';
  try{await cargarSap();}catch(_){}
  if(S.tab!=='ped')return;
  const sin=S.eq.filter(e=>!e.Criticidad).length,P=S.ped;
  $('view').innerHTML=`<p class="hint">Repuestos instalados en los equipos, agrupados por código SAP y por categoría. Completá los cambios previstos y el stock mínimo de cada uno y SIGMA calcula cuánto pedir descontando el stock de SAP.</p>
   <div id="pkp"></div>
   <div class="bar"><label><input type="checkbox" ${P.soloPedir?'checked':''} onchange="S.ped.soloPedir=this.checked;drawPed()"> Mostrar solo lo que hay que pedir</label>
    <select id="pcat" onchange="S.ped.cat=this.value;drawPed()"><option value="">Todas las categorías</option>${CATEGORIAS.map(c=>`<option ${P.cat===c?'selected':''}>${c}</option>`).join('')}</select>
    <button onclick="exportarPedido()">Exportar solicitud a Excel</button></div>
   <details ${S.opt?'open':''} ontoggle="S.opt=this.open"><summary>Equipos incluidos</summary><div class="bar">Criticidad:
    ${['A','B','C','?'].map(c=>`<label><input type="checkbox" ${S.crit.has(c)?'checked':''} onchange="this.checked?S.crit.add('${c}'):S.crit.delete('${c}');viewPed()"> ${c==='?'?'Sin clasificar ('+sin+')':c}</label>`).join(' ')}</div></details>
   <div id="pbody"></div>
   <h3>Otros ítems (herramientas, bulonería especial, grasas…)</h3>
   <p><small>Lo que no sale de los equipos instalados se agrega a mano y entra en la solicitud tal cual.</small></p>
   <div id="pman"></div>`;
  drawPed();drawManual();
}
function stockMap(){const m=new Map();S.stock.forEach(r=>{const k=claveSap(r.Codigo_SAP);if(k)m.set(k,num(r.Stock));});return m;}
function descMap(){const m=new Map();[...S.sap.cat,...S.sap.des].forEach(r=>{const k=claveSap(r.Codigo_SAP);if(k&&r.Descripcion)m.set(k,r.Descripcion);});return m;}
function drawPed(){
  const P=S.ped,R=calcularPedido(S.rep,S.eq,S.pre,stockMap(),descMap(),S.crit);
  P.items=[...R.items,...R.sinCodigo];P.R=R;
  const manual=S.manual.map(m=>({...m,_c:num(m.Cantidad)}));
  const aPedir=R.items.filter(i=>i.aPedir>0),costo=aPedir.reduce((t,i)=>t+i.aPedir*i.costo,0);
  const sinStock=!S.stock.length;
  $('pkp').innerHTML=`<div class="kp"><div><b>${aPedir.length+manual.length}</b>Renglones a pedir</div><div><b>${R.items.length}</b>Repuestos con código SAP</div>
   <div><b class="${R.sinCodigo.length?'warn':''}">${R.sinCodigo.length}</b>Sin código SAP (no se pueden pedir)</div><div><b>${fmt(costo)}</b>Costo estimado de lo que sale de los equipos</div></div>`+

function puntajeEnc(celda,campo){
  const c=sinTilde(celda);if(!c)return 0;
  let best=0;
  SAP_COLS[campo].forEach(sn=>{if(c===sn)best=Math.max(best,3);else if(c.startsWith(sn+' ')||c.endsWith(' '+sn))best=Math.max(best,2);else if(sn.length>4&&c.includes(sn))best=Math.max(best,1);});
  return best;
}
/** Busca la fila de encabezados (SAP a veces agrega títulos arriba) y asigna cada campo a una columna. */
function detectarEncabezado(m){
  let mejor={fila:0,map:{},n:-1};
  for(let r=0;r<Math.min(m.length,30);r++){
    const fila=m[r]||[],usado=new Set(),map={};
    SAP_CAMPOS.map(c=>c[0]).forEach(campo=>{
      let b=-1,bs=0;
      fila.forEach((cel,j)=>{if(usado.has(j))return;const p=puntajeEnc(cel,campo);if(p>bs){bs=p;b=j;}});
      if(b>=0){map[campo]=b;usado.add(b);}
    });
    const n=Object.keys(map).length+(map.codigo!=null&&map.descripcion!=null?5:0);
    if(n>mejor.n)mejor={fila:r,map,n};
  }
  return mejor;
}
/** Números de SAP/Excel: 1234.5 | "1.234,56" | "1,234.56" | "$ 1.234,5" | "1234,5" */
function parsePrecio(v){
  if(typeof v==='number')return isFinite(v)&&v>=0?v:'';
  let t=String(v==null?'':v).replace(/[^\d.,-]/g,'');
  if(!t||t==='-')return '';
  const c=t.lastIndexOf(','),d=t.lastIndexOf('.');
  if(c>-1&&d>-1)t=c>d?t.replace(/\./g,'').replace(',','.'):t.replace(/,/g,'');
  else if(c>-1)t=/^-?\d{1,3}(,\d{3})+$/.test(t)?t.replace(/,/g,''):t.replace(',','.');
  else if(d>-1&&/^-?\d{1,3}(\.\d{3}){2,}$/.test(t))t=t.replace(/\./g,'');
  const n=parseFloat(t);
  return isFinite(n)&&n>=0?n:'';
}

const tipoDe=(desc)=>{

const enSet=(set,t)=>set.has(t)||(t.length>4&&(set.has(t.replace(/(es|s)$/,''))));
/** Propuesta automática. Devuelve {estado:'Mecanico'|'Revisar'|'Descartado', motivo, tipo}. */
function clasificarSap(desc,grupo,grupoReal){
  const g=sinTilde(grupo),d=sinTilde(desc),tipo=tipoDe(desc);
  const gv=grupoReal?(RE_GRUPO_NO.test(g)?'D':RE_GRUPO_SI.test(g)?'M':null):null;
  let dv=null;
  if(RE_DESC_NO.test(d))dv='D';
  else if(tipo&&enSet(TIPOS_NO,tipo))dv='D';
  else if(tipo&&enSet(TIPOS_MEC,tipo))dv='M';
  if(gv&&dv&&gv!==dv)return{estado:'Revisar',motivo:'Grupo y descripción no coinciden',tipo};
  const v=gv||dv;
  if(!v)return{estado:'Revisar',motivo:'Sin regla',tipo};
  return{estado:v==='D'?'Descartado':'Mecanico',motivo:gv?'Grupo: '+String(grupo).slice(0,40):'Tipo de artículo: '+(tipo||'—'),tipo};
}
/** Arma las filas a importar a partir de la matriz del archivo, el mapeo y las decisiones anteriores. */
function prepararImportacion(m,fila,map,previas,sobreescribir){
  const filas=new Map(),r={leidas:0,sin_codigo:0,duplicadas:0,sin_precio:0,precio_calculado:0,sin_stock:0},stk=new Map();
  const derivado=map.grupo==null&&map.grupo2==null,calc=map.precio==null&&map.stock!=null&&map.valor!=null;
  const acc=new Map();
  for(let i=fila+1;i<m.length;i++){
    const f=m[i]||[];
    const cod=String(f[map.codigo]==null?'':f[map.codigo]).trim();
    const desc=String(f[map.descripcion]==null?'':f[map.descripcion]).trim();
    if(!cod&&!desc)continue;
    r.leidas++;
    const k=claveSap(cod);
    if(!k){r.sin_codigo++;continue;}
    const g1=map.grupo!=null?String(f[map.grupo]==null?'':f[map.grupo]).trim():'';
    const g2=map.grupo2!=null?String(f[map.grupo2]==null?'':f[map.grupo2]).trim():'';
    const grupo=derivado?(tipoDe(desc).toUpperCase()||'(SIN TIPO)'):(g1&&g2?g1+' · '+g2:(g2||g1||'(sin grupo)'));
    const precio=map.precio!=null?parsePrecio(f[map.precio]):'';
    const unidad=map.unidad!=null?String(f[map.unidad]==null?'':f[map.unidad]).trim():'';
    if(calc){   // el listado trae stock y su valor: precio unitario = valor ÷ cantidad (se suman varios almacenes/lotes del mismo material)
      const st=parsePrecio(f[map.stock]),va=parsePrecio(f[map.valor]);
      if(st!==''&&va!==''&&st>0){const a=acc.get(k)||{s:0,v:0};a.s+=st;a.v+=va;acc.set(k,a);}
    }
    if(map.stock!=null){const sv=parsePrecio(f[map.stock]);if(sv!==''){const x=stk.get(k)||{Codigo_SAP:cod,Stock:0};x.Stock+=sv;stk.set(k,x);}}
    if(filas.has(k)){r.duplicadas++;const a=filas.get(k);if(precio!==''&&a.Precio==='')a.Precio=precio;if(!a.Descripcion&&desc)a.Descripcion=desc;continue;}
    const prev=previas.get(k),prop=clasificarSap(desc,grupo,!derivado);
    filas.set(k,{Codigo_SAP:cod,Descripcion:desc,Unidad:unidad,Grupo_Articulos:grupo,Precio:precio,
      Estado:prev&&!sobreescribir?prev:prop.estado,Motivo:prev&&!sobreescribir?'Decisión anterior':prop.motivo,_nuevo:!prev,_propuesta:prop.estado});
  }
  filas.forEach((f,k)=>{
    const a=acc.get(k);
    if(f.Precio===''&&a&&a.s>0&&a.v>0){f.Precio=Math.round(a.v/a.s*100)/100;r.precio_calculado++;}
    if(f.Precio==='')r.sin_precio++;
  });
  r.derivado=derivado;r.calculado=calc;
  return{filas:Array.from(filas.values()),res:r,stock:Array.from(stk.values()).map(x=>({Codigo_SAP:x.Codigo_SAP,Stock:Math.round(x.Stock*1000)/1000}))};
}

/* ===== INICIO LÓGICA PEDIDO ===== */
const CATEGORIAS=['Rodamientos','Retenes','Sellos y empaquetaduras','Acoples y elásticos','Correas y transmisión','Partes mecánicas','Bulonería y fijaciones','Filtros y lubricantes','Herramientas','Otros'];
const REGLAS_CAT=[
  ['Rodamientos',/\b(rodam|manguito)/],['Retenes',/\breten/],
  ['Sellos y empaquetaduras',/sello|empaquet|vedacion|junta|o ring|oring|goma buna/],
  ['Acoples y elásticos',/acople|periflex|gummi|fundal|manchon|buje de goma|elastico/],
  ['Correas y transmisión',/correa|cadena|polea|catalina|freno|pastilla/],
  ['Filtros y lubricantes',/filtro|aceite|grasa|lubric/],
  ['Bulonería y fijaciones',/bulon|tuerca|arandela|prisionero|chaveta|pasador|perno|tornillo|esparrago|cuna/],
  ['Herramientas',/herramient|extractor|calibre|torquimetro|pinza/],
  ['Partes mecánicas',/impulsor|rotor|estator|difusor|disco|cabezal|cuerpo|camisa|\beje\b|diafragma|membrana|cojinete|buje|soporte|articulacion|pala\b/]
];
/** Categoría sugerida según el nombre y la designación del repuesto (se puede corregir a mano). */
function categoriaDe(r){
  const t=sinTilde((r.Nombre||'')+' '+(r.Designacion||''));
  for(const [c,re] of REGLAS_CAT)if(re.test(t))return c;
  return 'Otros';
}
/**
 * Agrupa los repuestos instalados por código SAP y calcula cuánto pedir (misma lógica que la planilla):
 *   previstos = instalados × (1 + cambios previstos por equipo)
 *   a pedir   = previstos + stock mínimo − stock en SAP   (nunca menos que 0)
 * Los repuestos sin código (S/C) no se pueden pedir: salen aparte hasta que se les asigne uno.
 */
function calcularPedido(rep,eq,pre,stockMap,descMap,crit){
  const cr={},sc={},nom={};
  eq.forEach(e=>{cr[e.Codigo_SIGMA]=e.Criticidad||'?';sc[e.Codigo_SIGMA]=e.Sector||'?';nom[e.Codigo_SIGMA]=e.Maquina||e.Codigo_SIGMA;});
  const M=new Map();let sinCantidad=0;
  rep.forEach(r=>{
    const c=cr[r.Codigo_Equipo]||'?';if(!crit.has(c))return;
    const q=num(r['Cant.']);if(!(q>0)){sinCantidad++;return;}
    const cod=norm(r.Codigo_Repuesto),sc_=!cod||cod==='S/C',k=clave(r);
    const key=sc_?k:'C|'+claveSap(cod);
    let it=M.get(key);
    if(!it){it={key,k,r,cod:sc_?'':cod,keys:[],inst:0,usos:[]};M.set(key,it);}
    if(!it.keys.includes(k))it.keys.push(k);
    it.inst+=q;it.usos.push({equipo:nom[r.Codigo_Equipo]||r.Codigo_Equipo,sector:sc[r.Codigo_Equipo]||'?',crit:c,q});
  });
  const dato=(it,campo)=>{for(const k of it.keys){const v=pre[k]&&pre[k][campo];if(v!==undefined&&v!=='')return v;}return '';};
  const items=[],sinCodigo=[];
  M.forEach(it=>{
    const sk=it.cod?claveSap(it.cod):'';
    it.material=(sk&&descMap.get(sk))||[it.r.Nombre,it.r.Designacion].filter(Boolean).join(' · ')||it.cod||'(sin nombre)';
    it.cat=dato(it,'Categoria')||categoriaDe(it.r);
    it.cambios=num(dato(it,'Cambios_Previstos'));it.smin=num(dato(it,'Stock_Min'));
    it.stock=sk&&stockMap.has(sk)?stockMap.get(sk):null;
    it.previstos=it.inst*(1+it.cambios);
    it.aPedir=Math.max(0,Math.ceil(it.previstos+it.smin-(it.stock||0)-1e-9));
    it.costo=num(dato(it,'Costo_Unitario'));
    (it.cod?items:sinCodigo).push(it);
  });
  const ord=(a,b)=>CATEGORIAS.indexOf(a.cat)-CATEGORIAS.indexOf(b.cat)||norm(a.material).localeCompare(norm(b.material));
  items.sort(ord);sinCodigo.sort(ord);
  return{items,sinCodigo,sinCantidad};
}
/* ===== FIN LÓGICA PEDIDO ===== */

function leerArchivoSap(file){
  if(!file)return;
  if(file.size>25*1024*1024)return sigmaToast('El archivo es demasiado grande (máximo 25 MB)');
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      // raw:true evita que SheetJS "interprete" los CSV (borraría ceros de los códigos y rompería "1.500,50")
      const esTexto=/\.(csv|txt)$/i.test(file.name);
      let wb;
      if(esTexto){
        let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(rd.result);}catch(_){txt=new TextDecoder('windows-1252').decode(rd.result);}
        wb=XLSX.read(txt,{type:'string',raw:true});
      }else wb=XLSX.read(rd.result,{type:'array',raw:true,cellDates:false});
      const hojas=wb.SheetNames;
      const mat=h=>XLSX.utils.sheet_to_json(wb.Sheets[h],{header:1,raw:true,defval:'',blankrows:true});
      let h=hojas[0],m=mat(h),mejor=detectarEncabezado(m);
      hojas.slice(1).forEach(x=>{const mm=mat(x),d=detectarEncabezado(mm);if(d.n>mejor.n){h=x;m=mm;mejor=d;}});
      S.sap.imp={archivo:file.name,hoja:h,m,fila:mejor.fila,map:mejor.map,over:{},reaplicar:false,listo:false,soloRev:true};
      drawImp();
    }catch(e){sigmaToast('No se pudo leer el archivo: '+e.message);}
  };
  rd.readAsArrayBuffer(file);
}

  const keys=Object.keys(G).filter(k=>!I.soloRev||G[k].c.Revisar>0).sort((a,b)=>G[b].n-G[a].n);
  html+=`<p><b>Clasificación propuesta:</b> ${tot.Mecanico} de mecánica · ${tot.Revisar} para revisar · ${tot.Descartado} a descartar.</p>
   <details open><summary>Corregir la clasificación por ${P.res.derivado?'tipo de artículo':'grupo'} (${keys.length} ${I.soloRev?'con dudas':'en total'})</summary>
   <p><small>Los artículos que ya conocés mantienen la decisión anterior. ${I.soloRev?'Solo se muestran los grupos con artículos para revisar; el resto ya tiene una propuesta clara.':''}</small>
   <button class="b" onclick="S.sap.imp.soloRev=!S.sap.imp.soloRev;S.sap.imp.verTodos=false;drawImp()">${I.soloRev?'Mostrar todos los grupos':'Mostrar solo los grupos con dudas'}</button></p>
   <div class="sc"><table><tr><th>${P.res.derivado?'Tipo de artículo':'Grupo de artículos'}</th><th class="num">Artículos</th><th>Propuesta automática</th><th>Qué hacer con los nuevos</th><th>Ejemplos</th></tr>`+
   keys.slice(0,I.verTodos?300:40).map(k=>{const g=G[k],o=I.over[k]||'';return `<tr><td>${esc(k)}</td><td class="num">${g.n}${g.nuevos?`<br><small>${g.nuevos} nuevos</small>`:''}</td>

    <td>${g.nuevos?`<select style="min-width:170px" onchange="I_over(this,${esc(JSON.stringify(k)).replace(/'/g,'&#39;')})"><option value="">Según la propuesta</option>

  if(keys.length>40&&!I.verTodos)html+=`<p><button class="b" onclick="S.sap.imp.verTodos=true;drawImp()">Ver los ${keys.length-40} grupos restantes</button></p>`;

   <div class="bar"><button id="btnImp" onclick="confirmarImportacion()">Importar ${P.filas.length} artículos</button> <button class="b" onclick="S.sap.imp=null;$('sapf').value='';drawImp()">Cancelar</button></div></div>`;

function resumenConc(){
  const pm=new Map();S.sap.cat.forEach(r=>{if(num(r.Precio)>0)pm.set(claveSap(r.Codigo_SAP),num(r.Precio));});
  const vistos=new Set();let ok=0,sinCod=0,no=0;
  S.rep.forEach(r=>{const k=clave(r);if(vistos.has(k))return;vistos.add(k);
    const c=norm(r.Codigo_Repuesto);if(!c||c==='S/C'){sinCod++;return;}
    if(pm.has(claveSap(c)))ok++;else no++;});
  return{total:vistos.size,ok,sinCod,no};
}

   (r.faltan.length?`<details><summary>Códigos de los equipos que no están en el listado de SAP (${r.no_estan_en_sap})</summary><div class="sc"><table><tr><th>Código</th><th>Repuesto</th></tr>${r.faltan.map(x=>`<tr><td>${esc(x.Codigo)}</td><td>${esc(x.Nombre)}</td></tr>`).join('')}</table></div></details>`:'');

    if(modo==='aplicar'){box.innerHTML=`<p><b>Listo:</b> ${r.cambiados} repuestos ahora usan el nombre de SAP.</p>`;sigmaToast('Nombres actualizados');return;}
    box.innerHTML=`<p>${r.cambiados} cambiarían de nombre · ${r.iguales} ya coinciden con SAP · ${r.no_estan_en_sap} con código que no está en SAP · ${r.sin_codigo} sin código (no se tocan).</p>`+
     (r.cambiados?`<div class="sc"><table><tr><th>Código</th><th>Nombre actual</th><th>Nombre en SAP</th></tr>${r.cambios.map(x=>`<tr><td>${esc(x.Codigo)}</td><td>${esc(x.Antes)}</td><td>${esc(x.Despues)}</td></tr>`).join('')}</table></div>`+(r.cambiados>r.cambios.length?`<p><small>Se muestran los primeros ${r.cambios.length}.</small></p>`:'')+
      `<div class="bar"><button class="b" onclick="if(confirm('Se van a reemplazar ${r.cambiados} nombres por los de SAP. ¿Continuar?'))nombresSap('aplicar')">Reemplazar ${r.cambiados} nombres por los de SAP</button></div>`:'');
  }catch(e){b.disabled=bR.disabled=false;sigmaToast('No se pudo: '+e.message);}
}
/* ---- cambio de códigos en bloque ---- */
function leerArchivoCodigos(file){
  if(!file)return;
  if(file.size>5*1024*1024)return sigmaToast('El archivo es demasiado grande');
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const wb=XLSX.read(rd.result,{type:'array',raw:true});
      let hallado=null;
      for(const h of wb.SheetNames){
        const m=XLSX.utils.sheet_to_json(wb.Sheets[h],{header:1,raw:true,defval:'',blankrows:false});
        for(let i=0;i<Math.min(m.length,10)&&!hallado;i++){
          const enc=(m[i]||[]).map(sinTilde),d=enc.indexOf('designacion'),c=enc.findIndex(x=>['codigo a usar','codigo nuevo','codigo sap nuevo'].includes(x));
          if(d>=0&&c>=0)hallado={m,fila:i,d,c};
        }
        if(hallado)break;
      }
      if(!hallado)return sigmaToast('No encontré las columnas «Designación» y «Código a usar» en el archivo');
      const cambios=[];
      hallado.m.slice(hallado.fila+1).forEach(r=>{
        const des=String(r[hallado.d]??'').trim(),cod=String(r[hallado.c]??'').trim();
        if(des&&/^[A-Za-z0-9][A-Za-z0-9\-\/. ]{0,29}$/.test(cod))cambios.push({Designacion:des,Codigo_Nuevo:cod});
      });
      if(!cambios.length)return sigmaToast('El archivo no tiene filas con designación y código');
      S.cod={archivo:file.name,cambios};codigosSap('simular');
    }catch(e){sigmaToast('No se pudo leer el archivo: '+e.message);}
  };
  rd.readAsArrayBuffer(file);
}
async function codigosSap(modo){
  const box=$('codres'),bR=$('btnCodR');
  if(modo!=='restaurar'&&!(S.cod&&S.cod.cambios))return sigmaToast('Primero elegí el archivo');
  if(bR)bR.disabled=true;
  try{
    const r=await sigmaApi('cambiar_codigos',modo==='restaurar'?{modo}:{modo,cambios:S.cod.cambios});
    if(bR)bR.disabled=false;
    if(modo!=='simular'){
      const [rep,pre]=await Promise.all([sigmaFetchTab('Repuestos'),sigmaFetchTab('Precios').catch(()=>[])]);
      S.rep=rep;S.pre={};pre.forEach(p=>S.pre[p.Clave_Repuesto]=p);
    }
    if(modo==='restaurar'){box.innerHTML=`<p><b>Listo:</b> ${r.restaurados} repuestos volvieron a su código original.</p>`;sigmaToast('Códigos restaurados');return;}
    if(modo==='aplicar'){S.cod=null;$('codf').value='';box.innerHTML=`<p><b>Listo:</b> se cambió el código de ${r.cambiados} repuestos${r.costos_copiados?` y se mantuvieron ${r.costos_copiados} costos`:''}.</p>`;sigmaToast('Códigos actualizados');return;}
    box.innerHTML=`<p><b>${esc(S.cod.archivo)}</b>: ${S.cod.cambios.length} designaciones leídas → ${r.cambiados} repuestos cambiarían de código · ${r.iguales} ya tienen ese código.</p>`+
     (r.designaciones_sin_filas.length?`<p class="warn"><small>Designaciones que no existen en Repuestos (no hacen nada): ${r.designaciones_sin_filas.map(esc).join(', ')}</small></p>`:'')+
     (r.fuera_de_sap.length?`<p class="warn"><small>Códigos nuevos que no están en el catálogo de SAP cargado: ${r.fuera_de_sap.map(esc).join(', ')}. Revisalos antes de aplicar.</small></p>`:'')+
     (r.cambiados?`<div class="sc"><table><tr><th>Equipo</th><th>Repuesto</th><th>Designación</th><th>Código actual</th><th>Código nuevo</th></tr>${r.cambios.map(x=>`<tr><td>${esc(x.Equipo)}</td><td>${esc(x.Repuesto)}</td><td>${esc(x.Designacion)}</td><td>${esc(x.Antes)||'<small>(vacío)</small>'}</td><td>${esc(x.Despues)}</td></tr>`).join('')}</table></div>`+(r.cambiados>r.cambios.length?`<p><small>Se muestran los primeros ${r.cambios.length}.</small></p>`:'')+
      `<div class="bar"><button onclick="if(confirm('Se va a cambiar el código de ${r.cambiados} repuestos. ¿Continuar?'))codigosSap('aplicar')">Cambiar el código de ${r.cambiados} repuestos</button></div>`:'');
  }catch(e){if(bR)bR.disabled=false;sigmaToast('No se pudo: '+e.message);}
}
async function aplicarPrecios(){
  const modo=(document.querySelector('input[name=modo]:checked')||{}).value||'vacios';
  if(modo==='todos'&&!confirm('Se van a reemplazar también los costos que ya estaban cargados por los de SAP. ¿Continuar?'))return;
  const b=$('btnAp');b.disabled=true;
  try{
    S.sap.res=await sigmaApi('aplicar_precios_sap',{modo});
    const pre=await sigmaFetchTab('Precios').catch(()=>[]);S.pre={};pre.forEach(p=>S.pre[p.Clave_Repuesto]=p);
    drawConc();sigmaToast('Precios aplicados');
  }catch(e){b.disabled=false;sigmaToast('No se pudo aplicar: '+e.message);}
}

/* ---- catálogo ---- */
function filasCat(){
  const A=S.sap,q=A.q.toLowerCase(),usados=new Set(S.rep.map(r=>claveSap(r.Codigo_Repuesto)));
  const base=[...A.cat.map(r=>({...r,_est:r.Estado==='Revisar'?'Revisar':'Mecanico'})),...(A.est==='Descartado'?A.des.map(r=>({...r,_est:'Descartado'})):[])];
  return base.filter(r=>(!A.est||r._est===A.est)&&(!q||(r.Codigo_SAP+' '+r.Descripcion+' '+r.Grupo_Articulos).toLowerCase().includes(q))&&(!A.libres||(r._est!=='Descartado'&&!usados.has(claveSap(r.Codigo_SAP)))));
}
function drawCat(){
  const box=$('cat');if(!box)return;const A=S.sap;
  if(!A.cat.length&&!A.des.length){box.innerHTML='<p>Todavía no hay artículos cargados.</p>';return;}
  box.innerHTML=`<div class="bar"><input id="cq" placeholder="Buscar por código, descripción o grupo" value="${esc(A.q)}" oninput="S.sap.q=this.value;clearTimeout(window._t);window._t=setTimeout(drawCatTabla,200)">
   <select onchange="S.sap.est=this.value;drawCatTabla()">${[['','Mecánica y a revisar'],['Mecanico','Solo mecánica'],['Revisar','Solo para revisar'],['Descartado','Descartados']].map(([v,l])=>`<option value="${v}" ${A.est===v?'selected':''}>${l}</option>`).join('')}</select>
   <label><input type="checkbox" ${A.libres?'checked':''} onchange="S.sap.libres=this.checked;drawCatTabla()"> Solo los que no están asignados a ningún equipo</label></div>
   <div data-requiere="importar_catalogo_sap"><div class="bar" id="selbar" style="display:none"><span id="selinfo"></span><button class="b" onclick="marcarSel('Mecanico')">Marcar como mecánica</button>
   <button class="b" onclick="marcarSel('Revisar')">Marcar para revisar</button><button class="b" onclick="marcarSel('Descartado')">Descartar</button></div>
   <p><small>Tildá artículos para clasificarlos.</small></p></div>
   <div class="sc" id="ctab"></div>`;
  drawCatTabla();
}
function drawCatTabla(){
  const A=S.sap,rows=filasCat(),mostrar=rows.slice(0,150);
  window._catRows=mostrar;
  avisoSel();
  $('ctab').innerHTML=`<p><small>${rows.length} artículos${rows.length>150?' (se muestran los primeros 150: usá el buscador para acotar)':''}</small></p>
   <table><tr><th><input type="checkbox" onchange="selTodos(this.checked)"></th><th>Código</th><th>Descripción</th><th>Grupo</th><th class="num">Precio</th><th>Estado</th></tr>`+
   mostrar.map((r,i)=>{const k=claveSap(r.Codigo_SAP);return `<tr><td><input type="checkbox" ${A.sel.has(k)?'checked':''} onchange="selUno('${esc(k).replace(/'/g,'')}',this.checked)"></td><td>${esc(r.Codigo_SAP)}</td><td>${esc(r.Descripcion)}</td><td><small>${esc(r.Grupo_Articulos)}</small></td>
   <td class="num">${num(r.Precio)>0?fmt(num(r.Precio)):'—'}${num(r.Precio_Anterior)>0&&num(r.Precio_Anterior)!==num(r.Precio)?`<br><small title="Precio anterior">antes ${fmt(num(r.Precio_Anterior))}</small>`:''}</td>
   <td>${r._est==='Revisar'?'<span class="warn">Revisar</span>':r._est==='Descartado'?'Descartado':'Mecánica'}</td></tr>`;}).join('')+'</table>';
}
function avisoSel(){const n=S.sap.sel.size,b=$('selbar'),i=$('selinfo');if(b)b.style.display=n?'flex':'none';if(i)i.textContent=n?`${n} seleccionados`:'';}
function selUno(k,on){on?S.sap.sel.add(k):S.sap.sel.delete(k);avisoSel();}
function selTodos(on){(window._catRows||[]).forEach(r=>{const k=claveSap(r.Codigo_SAP);on?S.sap.sel.add(k):S.sap.sel.delete(k);});drawCatTabla();}
async function marcarSel(estado){
  const A=S.sap;if(!A.sel.size)return sigmaToast('Primero tildá los artículos');
  const todos=[...A.cat,...A.des].filter(r=>A.sel.has(claveSap(r.Codigo_SAP)));
  const filas=todos.map(r=>({Codigo_SAP:r.Codigo_SAP,Descripcion:r.Descripcion,Unidad:r.Unidad,Grupo_Articulos:r.Grupo_Articulos,Precio:num(r.Precio)>0?num(r.Precio):'',Estado:estado,Motivo:'Decisión manual'}));
  if(estado==='Descartado'&&!confirm(`Se van a descartar ${filas.length} artículos. Se guardan aparte y no vuelven a molestar en próximas cargas. ¿Continuar?`))return;
  try{await sigmaApi('importar_catalogo_sap',{filas});A.sel.clear();await cargarSap(true);viewSap();sigmaToast('Actualizado');}
  catch(e){sigmaToast('No se pudo guardar: '+e.message);}
}

load();
</script></body></html>
