<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGMA — Novedades | Ingenio Bella Vista</title>
<link rel="stylesheet" href="sigma-styles.css">
<script src="sigma-utils.js"></script>
<style>
  .subtitle{color:var(--steel-400);font-size:.85rem;margin:-.6rem 0 1.4rem;max-width:640px;}

  /* ---------- Pendientes ---------- */
  .pendiente-card{
    display:flex; justify-content:space-between; align-items:flex-start; gap:.8rem;
    padding:.8rem 0; border-bottom:1px solid var(--line);
  }
  .pendiente-card:last-child{border-bottom:none;}
  .pendiente-titulo{font-weight:600; color:var(--steel-200); font-size:.88rem;}
  .pendiente-sub{font-size:.76rem; color:var(--steel-400); margin-top:.15rem;}
  .pendiente-derecha{text-align:right; flex-shrink:0;}
  .pendiente-antiguedad{font-family:var(--font-mono); font-size:.7rem; color:var(--warn-500); margin-top:.3rem;}

  /* ---------- Filtros de tipo ---------- */
  .mini-toggle{display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1.1rem;}
  .mini-toggle button{
    font-family:var(--font-body); font-weight:600; font-size:.76rem;
    padding:.4rem .8rem; border-radius:999px; border:1px solid var(--line);
    background:var(--steel-900); color:var(--steel-400); cursor:pointer;
    display:flex; align-items:center; gap:.4rem;
  }
  .mini-toggle button .dot-tipo{width:8px; height:8px; border-radius:50%;}
  .mini-toggle button.active{background:var(--amber-glow); border-color:var(--amber-500); color:var(--steel-200);}

  /* ---------- Línea de tiempo vertical ---------- */
  .timeline{position:relative;}
  .timeline-item{display:grid; grid-template-columns:86px 22px 1fr; column-gap:0;}
  .timeline-fecha{
    font-family:var(--font-mono); font-size:.7rem; color:var(--steel-400);
    text-align:right; padding-right:.7rem; padding-top:.1rem; line-height:1.3;
  }
  .timeline-marker{position:relative; display:flex; justify-content:center;}
  .timeline-marker::before{
    content:""; position:absolute; top:2px; bottom:-1.35rem; left:50%;
    width:2px; background:var(--line); transform:translateX(-50%);
  }
  .timeline-item:last-child .timeline-marker::before{display:none;}
  .timeline-dot{
    width:11px; height:11px; border-radius:50%; background:var(--steel-600);
    border:2px solid var(--steel-900); z-index:1; margin-top:.15rem;
  }
  .timeline-item.reciente .timeline-dot{background:var(--amber-500); box-shadow:0 0 0 4px var(--amber-glow);}
  .timeline-content{padding-bottom:1.35rem;}
  .timeline-titulo{font-weight:700; color:var(--steel-200); font-size:.88rem;}
  .timeline-item.reciente .timeline-titulo{color:var(--amber-500);}
  .timeline-sub{font-size:.78rem; color:var(--steel-400); margin-top:.1rem;}
</style>
</head>
<body>

<div id="nav-slot"></div>

<div class="container">
  <div class="panel-head">
    <h1>Novedades</h1>
    <div class="status-line" id="estado-carga">Cargando…</div>
  </div>
  <p class="subtitle">Qué se hizo, qué se está haciendo y qué queda pendiente — en un solo lugar.</p>

  <div class="plate panel">
    <div class="panel-head">
      <h2>Pendientes / en curso</h2>
      <span class="kpi-sub" id="contador-pendientes"></span>
    </div>
    <div id="lista-pendientes"><div class="empty-state">Cargando…</div></div>
  </div>

  <div class="plate panel">
    <div class="panel-head"><h2>Línea de tiempo</h2></div>
    <div class="mini-toggle" id="filtroTipos">
      <button type="button" data-tipo="orden" class="active"><span class="dot-tipo" style="background:#6c5dd3;"></span>Órdenes</button>
      <button type="button" data-tipo="mantenimiento" class="active"><span class="dot-tipo" style="background:#1dbf73;"></span>Mantenimientos</button>
      <button type="button" data-tipo="tarea" class="active"><span class="dot-tipo" style="background:#ffa800;"></span>Tareas de gestión</button>
      <button type="button" data-tipo="avance" class="active"><span class="dot-tipo" style="background:#3b82f6;"></span>Avances</button>
    </div>
    <div class="timeline" id="timeline"><div class="empty-state">Cargando…</div></div>
  </div>
</div>

<script>
document.getElementById("nav-slot").innerHTML = sigmaRenderNav("novedades");

const COLOR_TIPO = { orden:"#6c5dd3", mantenimiento:"#1dbf73", tarea:"#ffa800", avance:"#3b82f6" };
let eventosTodos = [];
let tiposActivos = new Set(["orden","mantenimiento","tarea","avance"]);
let equiposPorCodigo = {};

function fmtFechaCorta(d){
  return d.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"}) + " " + d.toLocaleTimeString("es-AR",{hour:"2-digit",minute:"2-digit"});
}

function nombreEquipo(cod){
  const eq = equiposPorCodigo[cod];
  return eq && eq.Maquina ? eq.Maquina : (cod || "—");
}

function diasDesde(fecha){
  return Math.floor((new Date() - fecha) / 86400000);
}

/* ---------- Pendientes ---------- */
function renderPendientes(ordenes, tareas){
  const pendientesOrdenes = ordenes
    .filter(o => o.Estado && o.Estado !== "Completada" && o.Estado !== "Cancelada")
    .map(o => ({
      titulo: `Orden ${o.Nro_Orden || ""} — ${o.Descripcion || "sin descripción"}`,
      sub: `${nombreEquipo(o.Codigo_Equipo)} · ${o.Codigo_Equipo || "—"}`,
      estado: o.Estado,
      fecha: sigmaParseDate(o.Fecha_Creacion) || new Date(0)
    }));

  const pendientesTareas = tareas
    .filter(t => t.Estado === "Pendiente")
    .map(t => ({
      titulo: `Tarea ${t.Nro_Tarea || ""} — ${t.Descripcion || "sin descripción"}`,
      sub: t.Codigo_Equipo ? `${nombreEquipo(t.Codigo_Equipo)} · ${t.Codigo_Equipo}` : "Gestión administrativa",
      estado: "Pendiente",
      fecha: sigmaParseDate(t.Fecha_Creacion) || new Date(0)
    }));

  const todas = [...pendientesOrdenes, ...pendientesTareas].sort((a,b) => a.fecha - b.fecha);

  document.getElementById("contador-pendientes").textContent = `${todas.length} pendiente(s)`;

  const cont = document.getElementById("lista-pendientes");
  if(!todas.length){
    cont.innerHTML = `<div class="empty-state">No hay órdenes ni tareas pendientes. 🎉</div>`;
    return;
  }
  cont.innerHTML = todas.map(p => `
    <div class="pendiente-card">
      <div>
        <div class="pendiente-titulo">${p.titulo}</div>
        <div class="pendiente-sub">${p.sub}</div>
      </div>
      <div class="pendiente-derecha">
        ${sigmaBadge("estado", p.estado)}
        <div class="pendiente-antiguedad">${diasDesde(p.fecha)} día(s) abierta</div>
      </div>
    </div>`).join("");
}

/* ---------- Línea de tiempo ---------- */
function renderTimeline(){
  const cont = document.getElementById("timeline");
  const visibles = eventosTodos
    .filter(e => tiposActivos.has(e.tipo))
    .sort((a,b) => b.fecha - a.fecha)
    .slice(0, 80);

  if(!visibles.length){
    cont.innerHTML = `<div class="empty-state">Sin actividad para mostrar con estos filtros.</div>`;
    return;
  }

  cont.innerHTML = visibles.map((e,i) => `
    <div class="timeline-item ${i===0 ? "reciente" : ""}">
      <div class="timeline-fecha">${fmtFechaCorta(e.fecha)}</div>
      <div class="timeline-marker"><div class="timeline-dot" style="${i===0?"":"background:"+COLOR_TIPO[e.tipo]+";border-color:var(--steel-900);"}"></div></div>
      <div class="timeline-content">
        <div class="timeline-titulo">${e.titulo}</div>
        <div class="timeline-sub">${e.sub}</div>
      </div>
    </div>`).join("");
}

document.querySelectorAll("#filtroTipos button").forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const tipo = btn.dataset.tipo;
    if(tiposActivos.has(tipo)){ tiposActivos.delete(tipo); btn.classList.remove("active"); }
    else { tiposActivos.add(tipo); btn.classList.add("active"); }
    renderTimeline();
  });
});

/* ---------- Carga de datos ---------- */
async function cargarNovedades(){
  try{
    const [ordenes, mantenimientos, tareas, avances, equiposLista] = await Promise.all([
      sigmaFetchTab("Ordenes_de_Trabajo").catch(()=>[]),
      sigmaFetchTab("Mantenimientos").catch(()=>[]),
      sigmaFetchTab("Gestion_Tareas").catch(()=>[]),
      sigmaFetchTab("Avances_Orden").catch(()=>[]),
      sigmaFetchTab("Equipos").catch(()=>[])
    ]);

    equiposPorCodigo = {};
    equiposLista.forEach(e => { equiposPorCodigo[e.Codigo_SIGMA] = e; });

    const eventos = [];

    ordenes.forEach(o => {
      const fCreacion = sigmaParseDate(o.Fecha_Creacion);
      if(fCreacion){
        eventos.push({
          tipo:"orden", fecha:fCreacion,
          titulo:`Orden creada — ${o.Descripcion || o.Nro_Orden || "sin descripción"}`,
          sub:`${nombreEquipo(o.Codigo_Equipo)} · ${sigmaBadge("estado", o.Estado)}`
        });
      }
      if(o.Estado === "Completada"){
        const fCierre = sigmaParseDate(o.Fecha_Cierre_Real);
        if(fCierre){
          eventos.push({
            tipo:"orden", fecha:fCierre,
            titulo:`Orden completada — ${o.Descripcion || o.Nro_Orden || "sin descripción"}`,
            sub:`${nombreEquipo(o.Codigo_Equipo)} · ${o.Codigo_Equipo || "—"}`
          });
        }
      }
    });

    mantenimientos.forEach(m => {
      const f = sigmaParseDate(m.Fecha_Fin) || sigmaParseDate(m.Fecha_Inicio);
      if(f){
        eventos.push({
          tipo:"mantenimiento", fecha:f,
          titulo:`Mantenimiento (${m.Tipo || "sin tipo"}) — ${nombreEquipo(m.Codigo_Equipo)}`,
          sub: m.Descripcion || m.Codigo_Equipo || ""
        });
      }
    });

    tareas.forEach(t => {
      const fCreacion = sigmaParseDate(t.Fecha_Creacion);
      if(fCreacion){
        eventos.push({
          tipo:"tarea", fecha:fCreacion,
          titulo:`Tarea creada — ${t.Descripcion || t.Nro_Tarea || "sin descripción"}`,
          sub: t.Codigo_Equipo ? nombreEquipo(t.Codigo_Equipo) : "Gestión administrativa"
        });
      }
      if(t.Estado === "Resuelta"){
        const fRes = sigmaParseDate(t.Fecha_Resolucion);
        if(fRes){
          eventos.push({
            tipo:"tarea", fecha:fRes,
            titulo:`Tarea resuelta — ${t.Descripcion || t.Nro_Tarea || "sin descripción"}`,
            sub: t.Codigo_Equipo ? nombreEquipo(t.Codigo_Equipo) : "Gestión administrativa"
          });
        }
      }
    });

    avances.forEach(a => {
      const f = sigmaParseDate(a.Fecha_Hora);
      if(f){
        eventos.push({
          tipo:"avance", fecha:f,
          titulo:`Avance ${a.Nro_Avance || ""} registrado`,
          sub: a.Descripcion || (a.Responsable ? `Responsable: ${a.Responsable}` : "")
        });
      }
    });

    eventosTodos = eventos;
    renderPendientes(ordenes, tareas);
    renderTimeline();

    document.getElementById("estado-carga").textContent = "Actualizado " + new Date().toLocaleTimeString("es-AR");
  }catch(err){
    console.error(err);
    document.getElementById("estado-carga").textContent = "Error al cargar: " + err.message;
    sigmaToast("Error al cargar Novedades: " + err.message);
  }
}

cargarNovedades();
</script>
</body>
</html>
