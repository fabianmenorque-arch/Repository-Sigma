<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGMA — Códigos QR | Ingenio Bella Vista</title>
<link rel="stylesheet" href="../sigma-styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="../sigma-utils.js"></script>
<style>
  .qr-toolbar{display:flex;gap:.8rem;align-items:flex-end;flex-wrap:wrap;margin-bottom:1.2rem;}
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;}
  .qr-card{padding:1rem;text-align:center;}
  .qr-card canvas, .qr-card img{margin:0 auto;background:#fff;padding:6px;border-radius:2px;}
  .qr-card .codigo{margin-top:.6rem;font-weight:600;color:var(--amber-500);font-size:.8rem;}
  .qr-card .meta{font-size:.72rem;color:var(--steel-400);margin-top:.1rem;}

  /* Vista de impresión: una etiqueta por equipo, sin nav ni sombras */
  @media print{
    body{background:#fff;}
    .sigma-nav,.qr-toolbar,.panel-head .btn,.no-print{display:none!important;}
    .container{max-width:none;padding:0;}
    .qr-grid{grid-template-columns:repeat(4,1fr);gap:.4cm;}
    .qr-card{border:1px solid #999;box-shadow:none;background:#fff;color:#000;break-inside:avoid;}
    .qr-card .codigo{color:#000;}
    .qr-card .meta{color:#333;}
  }
</style>
</head>
<body>

<div id="nav-slot"></div>

<div class="container">
  <div class="panel-head">
    <h1>Códigos QR de equipos</h1>
    <button class="no-print" id="btn-imprimir">Imprimir etiquetas</button>
  </div>

  <p style="font-size:.85rem;color:var(--steel-400);max-width:60ch;">
    Cada QR abre directamente la hoja de vida del equipo. Pegalo en la
    máquina para identificarla al instante y cargar mediciones u órdenes
    de trabajo escaneando con el celular.
  </p>

  <div class="filter-bar qr-toolbar no-print">
    <div class="field">
      <label>Buscar</label>
      <input type="text" id="filtro-texto" placeholder="Código, sector, máquina…">
    </div>
    <div class="field">
      <label>Tamaño de etiqueta</label>
      <select id="tamano-qr">
        <option value="110">Chica (110px)</option>
        <option value="150" selected>Media (150px)</option>
        <option value="200">Grande (200px)</option>
      </select>
    </div>
  </div>

  <div class="qr-grid" id="qr-grid">
    <div class="empty-state">Cargando equipos…</div>
  </div>
</div>

<script>
document.getElementById("nav-slot").innerHTML = sigmaRenderNav("qr", "../");

// Carpeta equipos/ donde vive esta página → así el QR apunta bien sin importar el dominio
const BASE_EQUIPOS_URL = new URL(".", window.location.href).href;

let equipos = [];

function pintarQR(lista){
  const grid = document.getElementById("qr-grid");
  const size = parseInt(document.getElementById("tamano-qr").value, 10);

  if(!lista.length){
    grid.innerHTML = `<div class="empty-state">Sin equipos que coincidan con el filtro.</div>`;
    return;
  }

  grid.innerHTML = lista.map(e => `
    <div class="plate qr-card">
      <div class="qr-holder" data-codigo="${e.Codigo_SIGMA}"></div>
      <div class="codigo">${e.Codigo_SIGMA}</div>
      <div class="meta">${e.Maquina||""}</div>
      <div class="meta">${e.Sector||""}${e.Ubicacion?" · "+e.Ubicacion:""}</div>
    </div>`).join("");

  document.querySelectorAll(".qr-holder").forEach(div => {
    const url = BASE_EQUIPOS_URL + sigmaRutaEquipo(div.dataset.codigo);
    new QRCode(div, {
      text: url,
      width: size,
      height: size,
      colorDark: "#14181c",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.M
    });
  });
}

function aplicarFiltro(){
  const texto = document.getElementById("filtro-texto").value.toLowerCase();
  const filtrados = equipos.filter(e =>
    `${e.Codigo_SIGMA} ${e.Sector} ${e.Ubicacion} ${e.Maquina}`.toLowerCase().includes(texto)
  );
  pintarQR(filtrados);
}

document.getElementById("filtro-texto").addEventListener("input", sigmaDebounce(aplicarFiltro, 180));
document.getElementById("tamano-qr").addEventListener("change", aplicarFiltro);
document.getElementById("btn-imprimir").addEventListener("click", () => window.print());

async function cargar(){
  try{
    equipos = await sigmaFetchTab("Equipos");
    pintarQR(equipos);
  }catch(err){
    document.getElementById("qr-grid").innerHTML =
      `<div class="empty-state">Error al cargar equipos: ${err.message}</div>`;
  }
}
cargar();
</script>
</body>
</html>
