<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="plateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242c33"/>
      <stop offset="100%" stop-color="#1b2126"/>
    </linearGradient>
    <linearGradient id="sigmaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ab4a"/>
      <stop offset="100%" stop-color="#d98f2b"/>
    </linearGradient>
    <radialGradient id="rivetGrad" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#9aa4ac"/>
      <stop offset="60%" stop-color="#4a545c"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
  </defs>

  <!-- Placa base -->
  <rect x="6" y="6" width="188" height="188" rx="22" fill="url(#plateGrad)" stroke="#d98f2b" stroke-width="3"/>

  <!-- Remaches -->
  <circle cx="26" cy="26" r="7" fill="url(#rivetGrad)"/>
  <circle cx="174" cy="26" r="7" fill="url(#rivetGrad)"/>
  <circle cx="26" cy="174" r="7" fill="url(#rivetGrad)"/>
  <circle cx="174" cy="174" r="7" fill="url(#rivetGrad)"/>

  <!-- Marca Sigma: trazo de chapa doblada -->
  <path d="M 148 58 L 52 58 L 110 100 L 52 142 L 148 142"
        fill="none" stroke="url(#sigmaGrad)" stroke-width="17"
        stroke-linecap="square" stroke-linejoin="miter"/>
