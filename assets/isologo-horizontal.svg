<svg viewBox="0 0 620 160" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@800&amp;family=IBM+Plex+Sans:wght@500&amp;display=swap');
    .word{ font-family:'Big Shoulders Display',sans-serif; font-weight:800; }
    .caption{ font-family:'IBM Plex Sans',sans-serif; font-weight:500; letter-spacing:.14em; }
  </style>
  <defs>
    <linearGradient id="plateGradH" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242c33"/>
      <stop offset="100%" stop-color="#1b2126"/>
    </linearGradient>
    <linearGradient id="sigmaGradH" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0ab4a"/>
      <stop offset="100%" stop-color="#d98f2b"/>
    </linearGradient>
    <radialGradient id="rivetGradH" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#9aa4ac"/>
      <stop offset="60%" stop-color="#4a545c"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
  </defs>

  <!-- Placa del icono -->
  <rect x="8" y="8" width="144" height="144" rx="18" fill="url(#plateGradH)" stroke="#d98f2b" stroke-width="2.5"/>
  <circle cx="24" cy="24" r="5.5" fill="url(#rivetGradH)"/>
  <circle cx="136" cy="24" r="5.5" fill="url(#rivetGradH)"/>
  <circle cx="24" cy="136" r="5.5" fill="url(#rivetGradH)"/>
  <circle cx="136" cy="136" r="5.5" fill="url(#rivetGradH)"/>
  <path d="M 120 46 L 40 46 L 88 80 L 40 114 L 120 114"
        fill="none" stroke="url(#sigmaGradH)" stroke-width="13"
        stroke-linecap="square" stroke-linejoin="miter"/>

  <!-- Wordmark -->
  <text x="182" y="98" class="word" font-size="68" fill="#ffffff" letter-spacing="1">SIGMA</text>
  <text x="184" y="124" class="caption" font-size="15" fill="#8b96a1">INGENIO BELLA VISTA</text>

  <!-- Filete separador -->
  <rect x="182" y="34" width="230" height="3" fill="#d98f2b"/>
</svg>
