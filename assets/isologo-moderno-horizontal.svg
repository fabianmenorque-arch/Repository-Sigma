<svg viewBox="0 0 640 170" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&amp;family=Inter:wght@500&amp;display=swap');
    .word{ font-family:'Space Grotesk',sans-serif; font-weight:700; }
    .caption{ font-family:'Inter',sans-serif; font-weight:500; letter-spacing:.22em; }
  </style>
  <defs>
    <linearGradient id="glowH" x1="15%" y1="5%" x2="95%" y2="100%">
      <stop offset="0%" stop-color="#ffb454"/>
      <stop offset="100%" stop-color="#d9622b"/>
    </linearGradient>
    <radialGradient id="blobH" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#ffb454" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#ffb454" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Resplandor sutil detrás del ícono -->
  <circle cx="95" cy="85" r="95" fill="url(#blobH)"/>

  <!-- Ícono: trazo continuo -->
  <path d="M 142 52 L 48 52 L 108 85 L 48 118 L 142 118"
        fill="none" stroke="url(#glowH)" stroke-width="17"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Wordmark -->
  <text x="200" y="98" class="word" font-size="56" fill="#f5f3f0" letter-spacing="-1">Sigma</text>
  <text x="202" y="126" class="caption" font-size="13" fill="#8b8378">INGENIO BELLA VISTA</text>
</svg>
