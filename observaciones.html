<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGMA — Observaciones | Ingenio Bella Vista</title>
<link rel="stylesheet" href="sigma-styles.css">
<script src="sigma-utils.js"></script>
</head>
<body>

<div id="nav-slot"></div>

<div class="container">
  <div class="panel-head"><h1>Observaciones de los operarios</h1></div>

  <div class="filter-bar">
    <div class="field">
      <label for="f-texto">Buscar</label>
      <input type="text" id="f-texto" placeholder="Equipo, operario o texto…">
    </div>
    <div class="field" style="max-width:200px;">
      <label for="f-dias">Período</label>
      <select id="f-dias">
        <option value="2">Últimas 48 horas</option>
        <option value="7" selected>Últimos 7 días</option>
        <option value="30">Últimos 30 días</option>
        <option value="0">Todo</option>
      </select>
    </div>
  </div>

  <div class="plate panel">
    <div class="table-scroll" style="max-height:none;">
      <table class="sigma-table" id="tabla">
        <thead><tr><th style="min-width:130px;">Fecha y hora</th><th>Equipo</th><th>Operario</th><th>Observación</th></tr></thead>
        <tbody><tr><td colspan="4" class="empty-state">Cargando…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script>
document.getElementById("nav-slot").innerHTML = sigmaRenderNav("observaciones");

let obs = [], equipos = [];
const nombreEquipo = cod => { const e = equipos.find(x => x.Codigo_SIGMA === cod); return e ? e.Maquina : null; };

function pintar(){
  const q = document.getElementById("f-texto").value.trim().toLowerCase();
  const dias = parseInt(document.getElementById("f-dias").value, 10);
  const desde = dias ? Date.now() - dias * 864e5 : 0;
  const filas = obs
    .filter(o => (new Date(o.Fecha_Hora).getTime() || 0) >= desde)
    .filter(o => !q || [o.Codigo_Equipo, nombreEquipo(o.Codigo_Equipo), o.Nombre, o.Usuario, o.Observacion].join(" ").toLowerCase().includes(q))
    .sort((a, b) => new Date(b.Fecha_Hora) - new Date(a.Fecha_Hora));
  const tbody = document.querySelector("#tabla tbody");
  if(!filas.length){ tbody.innerHTML = `<tr><td colspan="4" class="empty-state">No hay observaciones en este período.</td></tr>`; return; }
  tbody.innerHTML = filas.map(o => {
    const n = nombreEquipo(o.Codigo_Equipo);
    return `<tr>
      <td>${sigmaEsc(sigmaFmtFechaHora(o.Fecha_Hora))}</td>
      <td class="equipo-celda"><span class="nombre">${sigmaEsc(n || o.Codigo_Equipo)}</span>${n ? `<span class="codigo">${sigmaEsc(o.Codigo_Equipo)}</span>` : ""}</td>
      <td>${sigmaEsc(o.Nombre || o.Usuario)}</td>
      <td style="white-space:pre-wrap;">${sigmaEsc(o.Observacion)}</td>
    </tr>`;
  }).join("");
}

async function cargar(){
  try{
    [obs, equipos] = await Promise.all([sigmaFetchTab("Observaciones"), sigmaFetchTab("Equipos").catch(() => [])]);
    pintar();
  }catch(err){
    document.querySelector("#tabla tbody").innerHTML = `<tr><td colspan="4" class="empty-state">No se pudo cargar: ${sigmaEsc(err.message)}</td></tr>`;
  }
}
document.getElementById("f-texto").addEventListener("input", sigmaDebounce(pintar, 200));
document.getElementById("f-dias").addEventListener("change", pintar);
cargar();
</script>
</body>
</html>
