<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIGMA — Informes | Ingenio Bella Vista</title>
<link rel="stylesheet" href="sigma-styles.css">
<script src="sigma-utils.js"></script>
<style>
  #sugerencias-orden{
    position:absolute;z-index:20;background:var(--steel-900);border:1px solid var(--line);
    width:100%;max-height:260px;overflow:auto;border-radius:var(--radius);display:none;
  }
  #sugerencias-orden div{padding:.55rem .7rem;cursor:pointer;font-size:.83rem;border-bottom:1px solid var(--line);}
  #sugerencias-orden div:last-child{border-bottom:none;}
  #sugerencias-orden div:hover{background:var(--steel-800);color:var(--amber-400);}
  .buscador-wrap{position:relative;}

  /* ---------- Línea de tiempo ---------- */
  .timeline{display:flex;align-items:flex-start;gap:0;margin:1.2rem 0 .4rem;}
  .tl-nodo{flex:0 0 auto;text-align:center;width:150px;position:relative;}
  .tl-punto{
    width:20px;height:20px;border-radius:50%;margin:0 auto .6rem;
    background:var(--steel-800);border:3px solid var(--steel-600);
  }
  .tl-nodo.activo .tl-punto{border-color:var(--amber-500);background:var(--amber-500);box-shadow:0 0 10px var(--amber-glow);}
  .tl-nodo.pendiente .tl-punto{border-color:var(--steel-600);background:transparent;}
  .tl-etapa{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--steel-400);font-weight:600;}
  .tl-fecha{font-size:.85rem;color:#fff;margin-top:.2rem;}
  .tl-linea{flex:1 1 auto;height:3px;background:var(--steel-600);margin-top:9px;position:relative;}
  .tl-linea.completa{background:var(--amber-500);}
  .tl-duracion{
    position:absolute;top:-22px;left:0;right:0;text-align:center;
    font-size:.72rem;color:var(--amber-400);font-weight:600;
  }

  /* ---------- Fotos ---------- */
  .foto-columnas{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem;}
  @media (max-width:700px){.foto-columnas{grid-template-columns:1fr;}}
  .upload-btn{display:inline-block;font-size:.8rem;margin-bottom:.7rem;}
  .upload-btn input{display:none;}

  textarea#observaciones{min-height:80px;}

  /* ---------- Impresión ---------- */
  @media print{
    body{background:#fff;color:#111;}
    .sigma-nav,.no-print,.filter-bar,.upload-btn,#form-buscar-orden{display:none!important;}
    .container{max-width:none;padding:0;}
    .plate{background:#fff;border:1px solid #999;box-shadow:none;color:#111;break-inside:avoid;}
    .plate::before,.plate::after{display:none;}
    h1,h2,h3,.tl-fecha,.kpi-value{color:#111!important;}
    .tl-etapa,.kpi-label{color:#444!important;}
    .tl-punto{border-color:#333!important;}
    .tl-nodo.activo .tl-punto{background:#333!important;border-color:#333!important;box-shadow:none;}
    .tl-linea{background:#999!important;}
    .tl-linea.completa{background:#333!important;}
    .gallery-grid img{border:1px solid #999;}
    a{color:#111;text-decoration:none;}
    .badge{border:1px solid #333;color:#111!important;background:none!important;}
  }
</style>
</head>
<body>

<div id="nav-slot"></div>

<div class="container">
  <div class="panel-head">
    <h1>Informe de mantenimiento</h1>
    <button class="no-print" id="btn-imprimir">Imprimir informe</button>
  </div>

  <!-- Buscador de orden -->
  <div class="plate panel no-print" id="form-buscar-orden">
    <div class="panel-head"><h2>Elegir orden de trabajo</h2></div>
    <div class="field buscador-wrap">
      <label for="buscar-orden">Buscar por equipo, descripción o número de orden</label>
      <input type="text" id="buscar-orden" placeholder="Ej: BV-CAL-BOMBADEA-002, o rodamiento, o OT-…" autocomplete="off">
      <div id="sugerencias-orden"></div>
    </div>
  </div>

  <div id="informe-vacio" class="empty-state">
    Buscá y elegí una orden de trabajo arriba para generar su informe.
  </div>

  <div id="informe-contenido" style="display:none;">

    <!-- Encabezado del informe -->
    <div class="plate panel rivets">
      <div class="grid-3">
        <div><label>Orden</label><div id="inf-nro" class="mono">—</div></div>
        <div><label>Equipo</label><div id="inf-equipo">—</div></div>
        <div><label>Estado</label><div id="inf-estado">—</div></div>
        <div><label>Tipo</label><div id="inf-tipo">—</div></div>
        <div><label>Prioridad</label><div id="inf-prioridad">—</div></div>
        <div><label>Responsable</label><div id="inf-responsable">—</div></div>
      </div>
      <div style="margin-top:1rem;">
        <label>Descripción del trabajo</label>
        <div id="inf-descripcion">—</div>
      </div>
    </div>

    <!-- Línea de tiempo -->
    <div class="plate panel">
      <div class="panel-head"><h2>Línea de tiempo</h2></div>
      <div class="timeline" id="timeline"></div>
    </div>

    <!-- Fotos antes / después -->
    <div class="plate panel">
      <div class="panel-head"><h2>Fotos</h2></div>
      <div class="foto-columnas">
        <div>
          <h3>Antes</h3>
          <label class="btn secondary upload-btn no-print">
            + Subir foto
            <input type="file" accept="image/*" capture="environment" id="foto-antes">
          </label>
          <div class="gallery-grid" id="galeria-antes"><div class="empty-state">Sin fotos todavía.</div></div>
        </div>
        <div>
          <h3>Después</h3>
          <label class="btn secondary upload-btn no-print">
            + Subir foto
            <input type="file" accept="image/*" capture="environment" id="foto-despues">
          </label>
          <div class="gallery-grid" id="galeria-despues"><div class="empty-state">Sin fotos todavía.</div></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
document.getElementById("nav-slot").innerHTML = sigmaRenderNav("informes");

let ordenes = [], equipos = [], imagenes = [];
let ordenActual = null;
let fotosLocales = {antes: [], despues: []}; // vistas previas locales de esta sesión

document.getElementById("btn-imprimir").addEventListener("click", () => window.print());

/* ---------- Buscador de orden ---------- */
const inputBuscar = document.getElementById("buscar-orden");
const cajaSugerencias = document.getElementById("sugerencias-orden");

inputBuscar.addEventListener("input", sigmaDebounce(() => {
  const q = inputBuscar.value.trim().toLowerCase();
  if(q.length < 2){ cajaSugerencias.style.display = "none"; return; }

  const coincidencias = ordenes.filter(o =>
    `${o.Nro_Orden} ${o.Codigo_Equipo} ${o.Descripcion} ${nombreEquipo(o.Codigo_Equipo)||""}`.toLowerCase().includes(q)
  ).slice(0, 15);

  if(!coincidencias.length){
    cajaSugerencias.innerHTML = `<div style="cursor:default;color:var(--steel-400);">Sin coincidencias.</div>`;
    cajaSugerencias.style.display = "block";
    return;
  }

  cajaSugerencias.innerHTML = coincidencias.map(o => `
    <div data-nro="${o.Nro_Orden}">
      <strong>${o.Nro_Orden}</strong> — ${nombreEquipo(o.Codigo_Equipo) || o.Codigo_Equipo}<br>
      <span style="color:var(--steel-400);">${o.Descripcion}</span>
    </div>`).join("");
  cajaSugerencias.style.display = "block";
}, 180));

cajaSugerencias.addEventListener("click", e => {
  const div = e.target.closest("div[data-nro]");
  if(!div) return;
  cargarInforme(div.dataset.nro);
  cajaSugerencias.style.display = "none";
  inputBuscar.value = "";
});

document.addEventListener("click", e => {
  if(!e.target.closest(".buscador-wrap")) cajaSugerencias.style.display = "none";
});

function nombreEquipo(codigo){
  const eq = equipos.find(e => e.Codigo_SIGMA === codigo);
  return eq && eq.Maquina ? eq.Maquina : null;
}

/* ---------- Línea de tiempo ---------- */
function fmtDuracion(horas){
  if(horas == null) return "";
  if(horas < 1) return Math.round(horas*60) + " min";
  return horas.toFixed(1) + " h";
}

function pintarTimeline(o){
  const etapas = [
    {clave:"Fecha_Creacion", etiqueta:"Creada"},
    {clave:"Fecha_Inicio", etiqueta:"Inicio"},
    {clave:"Fecha_Cierre_Real", etiqueta:"Cierre"}
  ];

  let html = "";
  etapas.forEach((etapa, i) => {
    const valor = o[etapa.clave];
    const fecha = sigmaParseDate(valor) ? sigmaFmtFechaHora(valor) : null;
    const estadoNodo = fecha ? "activo" : "pendiente";
    html += `
      <div class="tl-nodo ${estadoNodo}">
        <div class="tl-punto"></div>
        <div class="tl-etapa">${etapa.etiqueta}</div>
        <div class="tl-fecha">${fecha || "—"}</div>
      </div>`;
    if(i < etapas.length-1){
      const siguiente = o[etapas[i+1].clave];
      const horas = sigmaHorasEntre(valor, siguiente);
      const completa = valor && siguiente;
      html += `
        <div class="tl-linea ${completa ? "completa" : ""}">
          ${horas != null ? `<div class="tl-duracion">${fmtDuracion(horas)}</div>` : ""}
        </div>`;
    }
  });

  document.getElementById("timeline").innerHTML = html;
}

/* ---------- Fotos ---------- */
function pintarGaleria(momento){
  const contenedorId = momento === "Antes" ? "galeria-antes" : "galeria-despues";
  const contenedor = document.getElementById(contenedorId);
  const key = momento === "Antes" ? "antes" : "despues";

  const deSheets = imagenes.filter(i => i.Nro_Orden === ordenActual.Nro_Orden && i.Momento === momento);
  const locales = fotosLocales[key];

  if(!deSheets.length && !locales.length){
    contenedor.innerHTML = `<div class="empty-state">Sin fotos todavía.</div>`;
    return;
  }

  const imgsSheets = deSheets.map(i => `<img src="${i.URL_Miniatura||i.URL}" data-full="${i.URL}" alt="${momento}">`).join("");
  const imgsLocales = locales.map(url => `<img src="${url}" data-full="${url}" alt="${momento} (subiendo…)" style="opacity:.7;">`).join("");

  contenedor.innerHTML = imgsSheets + imgsLocales;
  sigmaInitGallery(`#${contenedorId}`);
}

async function subirFoto(input, momento){
  const file = input.files[0];
  if(!file || !ordenActual) return;

  const key = momento === "Antes" ? "antes" : "despues";
  try{
    const urlLocal = await sigmaSubirImagen(file, {
      Codigo_Equipo: ordenActual.Codigo_Equipo,
      Nro_Orden: ordenActual.Nro_Orden,
      Momento: momento
    });
    fotosLocales[key].push(urlLocal);
    pintarGaleria(momento);
    sigmaToast(`Foto "${momento}" guardada.`);
  }catch(err){
    sigmaToast("Error al subir la foto: " + err.message);
  }finally{
    input.value = "";
  }
}

document.getElementById("foto-antes").addEventListener("change", e => subirFoto(e.target, "Antes"));
document.getElementById("foto-despues").addEventListener("change", e => subirFoto(e.target, "Después"));

/* ---------- Carga del informe ---------- */
function cargarInforme(nroOrden){
  const o = ordenes.find(x => x.Nro_Orden === nroOrden);
  if(!o) return;
  ordenActual = o;
  fotosLocales = {antes:[], despues:[]};

  document.getElementById("informe-vacio").style.display = "none";
  document.getElementById("informe-contenido").style.display = "block";

  document.getElementById("inf-nro").textContent = o.Nro_Orden;
  document.getElementById("inf-equipo").innerHTML =
    `<a href="equipos/${o.Codigo_Equipo}.html">${nombreEquipo(o.Codigo_Equipo) || o.Codigo_Equipo}</a>`;
  document.getElementById("inf-estado").innerHTML = sigmaBadge("estado", o.Estado);
  document.getElementById("inf-tipo").textContent = o.Tipo || "—";
  document.getElementById("inf-prioridad").innerHTML = sigmaBadge("prioridad", o.Prioridad);
  document.getElementById("inf-responsable").textContent = o.Responsable || "—";
  document.getElementById("inf-descripcion").textContent = o.Descripcion || "—";

  pintarTimeline(o);
  pintarGaleria("Antes");
  pintarGaleria("Después");
}

/* ---------- Carga inicial ---------- */
async function cargarDatos(){
  try{
    [ordenes, equipos, imagenes] = await Promise.all([
      sigmaFetchTab("Ordenes_de_Trabajo").catch(()=>[]),
      sigmaFetchTab("Equipos").catch(()=>[]),
      sigmaFetchTab("Imagenes").catch(()=>[])
    ]);
    ordenes.sort((a,b) => (b.Fecha_Creacion||"").localeCompare(a.Fecha_Creacion||""));

    // Si viene con ?orden=OT-xxxx en la URL (ej. link desde ordenes.html), cargarlo directo
    const params = new URLSearchParams(window.location.search);
    const nroDesdeURL = params.get("orden");
    if(nroDesdeURL) cargarInforme(nroDesdeURL);
  }catch(err){
    document.getElementById("informe-vacio").textContent = "Error al cargar datos: " + err.message;
  }
}
cargarDatos();
</script>
</body>
</html>
